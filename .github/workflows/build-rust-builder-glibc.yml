---
# Build rust-builder-glibc image and push to GHCR.
name: Build rust-builder-glibc container

on:
  push:
    branches: [main]
    paths:
      - "rust-builder-glibc/**"
      - ".github/workflows/build-rust-builder-glibc.yml"
      - ".github/workflows/build-and-push-image.yml"

# One run per workflow per ref: a newer push supersedes an in-flight build of the
# same image, since both would publish the same tags. Not set in
# build-and-push-image.yml, because sibling jobs there (opensuse base/dev,
# the five tactical-rmm components) share a caller and would cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build rust-builder-glibc image
    uses: ./.github/workflows/build-and-push-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image-name: rust-builder-glibc
