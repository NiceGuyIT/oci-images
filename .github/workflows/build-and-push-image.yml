---
# Reusable workflow for building and pushing container images using Docker BuildKit.
name: Build and push image

on:
  workflow_call:
    inputs:
      image-name:
        description: "Name of image (directory) to build"
        required: true
        type: string
      image-type:
        description: "Space-separated image variants to build in one job (e.g. `base dev`). Only needed for multi-target images like opensuse-base. Variants build in the order given on one runner, so a variant whose stage is FROM an earlier one reuses those layers instead of rebuilding them."
        required: false
        default: ""
        type: string
    outputs:
      registry-paths:
        description: "Registry paths where the image was pushed"
        value: ${{ jobs.build-and-push.outputs.registry-paths }}

jobs:
  build-and-push:
    name: Build and push ${{ inputs.image-name }}${{ inputs.image-type != '' && format(' ({0})', inputs.image-type) || '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REGISTRY: ""
      REGISTRY_PROVIDER: ghcr.io
      REGISTRY_USER: ""
    outputs:
      registry-paths: ${{ steps.push-image.outputs.registry-paths }}

    steps:
      - name: Clone the repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      # Use Nushell for all scripts.
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.112.2"

      # The repository owner needs to be lowercase.
      - name: Set environment variables
        shell: nu {0}
        run: |
          let owner = ($env.GITHUB_REPOSITORY_OWNER | str downcase)
          $"REGISTRY_USER=($owner)\n" | save --append $env.GITHUB_ENV
          $"IMAGE_REGISTRY=($env.REGISTRY_PROVIDER)/($owner)\n" | save --append $env.GITHUB_ENV

      - name: Build ${{ inputs.image-name }}${{ inputs.image-type != '' && format(' ({0})', inputs.image-type) || '' }}
        id: build-image
        shell: nu {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd ${{ inputs.image-name }}
          # Empty input means the image has no variants, so build.nu takes no argument.
          let variants = ("${{ inputs.image-type }}" | split row ' ' | where {|v| $v | is-not-empty })
          let targets = if ($variants | is-empty) { [null] } else { $variants }

          # Each build.nu run appends its own image=/tags= pair, so give every run a
          # private output file. Writing them all to GITHUB_OUTPUT would leave duplicate
          # keys and only the last variant would survive.
          mut builds = []
          for target in $targets {
            let out = (mktemp --tmpdir $"build-output-XXXXXX.log")
            with-env {GITHUB_OUTPUT: $out} {
              if ($target == null) { ./build.nu } else { ./build.nu $target }
            }
            # One run can emit several pairs: tactical-rmm/build.nu with no component
            # builds all five. Zip them all rather than keeping only the last.
            let written = (open $out | lines | where {|l| $l | is-not-empty })
            let images = ($written | where {|l| $l | str starts-with 'image=' } | each {|l| $l | str replace 'image=' '' })
            let tag_sets = ($written | where {|l| $l | str starts-with 'tags=' } | each {|l| $l | str replace 'tags=' '' })
            if ($images | is-empty) {
              error make {msg: $"build.nu wrote no image= line to ($out)"}
            }
            if ($images | length) != ($tag_sets | length) {
              error make {msg: $"($images | length) image= lines but ($tag_sets | length) tags= lines in ($out)"}
            }
            $builds = ($builds | append ($images | zip $tag_sets | each {|pair| {image: $pair.0, tags: $pair.1}}))
          }

          print $"Built: ($builds | each {|b| $b.image} | str join ', ')"
          $"builds=($builds | to json --raw)\n" | save --append $env.GITHUB_OUTPUT

      - name: Push image to GitHub Container Registry
        id: push-image
        shell: nu {0}
        env:
          BUILDS: ${{ steps.build-image.outputs.builds }}
        run: |
          let builds = ($env.BUILDS | from json)

          # GHCR intermittently returns "unknown blob" (registry BLOB_UNKNOWN)
          # during a push; a retry clears it. Without retries a transient blob
          # error fails the job and silently leaves stale content under the
          # mutable version tag, so a changed image never actually publishes.
          let max_attempts = 5

          mut registry_paths = []
          for build in $builds {
          for tag in ($build.tags | split row ' ' | where {|t| $t | is-not-empty }) {
            let image = $build.image
            let local_tag = $"($image):($tag)"
            let remote_tag = $"($env.IMAGE_REGISTRY)/($image):($tag)"
            print $"Tagging ($local_tag) as ($remote_tag)"
            ^docker tag $local_tag $remote_tag

            mut attempt = 1
            mut pushed = false
            while (not $pushed) {
              print $"Pushing ($remote_tag) - attempt ($attempt) of ($max_attempts)"
              let result = (^docker push $remote_tag | complete)
              print $result.stdout
              print $result.stderr
              if $result.exit_code == 0 {
                $pushed = true
              } else if $attempt >= $max_attempts {
                error make {msg: $"Failed to push ($remote_tag) after ($max_attempts) attempts, last exit code ($result.exit_code)"}
              } else {
                let backoff = ($attempt * 10)
                print $"Push failed with exit code ($result.exit_code); retrying in ($backoff)s..."
                sleep ($backoff * 1sec)
                $attempt = ($attempt + 1)
              }
            }

            $registry_paths = ($registry_paths | append $remote_tag)
          }
          }

          let paths = ($registry_paths | str join ', ')
          print $"Pushed: ($paths)"
          $"registry-paths=($paths)\n" | save --append $env.GITHUB_OUTPUT

      - name: Print image URL
        run: echo "Image pushed to ${{ steps.push-image.outputs.registry-paths }}"
