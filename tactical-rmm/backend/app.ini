; uWSGI configuration for the Tactical RMM Django API.
;
; Seeded into /opt/tactical/conf/app.ini on first run and never rewritten, so
; edits here survive a restart. Bind-mount your own over it if you prefer, read
; only is fine. Set TRMM_PERSISTENT_CONFIG=0 to have tactical-init overwrite it
; from this template again.
;
; Replaces `manage.py create_uwsgi_conf`, which regenerated the file on every
; init and hardcoded five keys (chdir, module, home, cheaper-algo, socket) that
; no Django setting could reach. TRMM_SETTING_UWSGI_* variables no longer do
; anything; change the values here instead.
;
; chdir and home are the image's baked paths and must match TACTICAL_DIR and
; VIRTUAL_ENV in the Dockerfile.

[uwsgi]
chdir = /opt/tactical/api
module = tacticalrmm.wsgi
home = /opt/venv

master = true
enable-threads = true
die-on-term = true
vacuum = true

; nginx reaches this over the uwsgi protocol via uwsgi_pass, not HTTP. To put an
; HTTP reverse proxy in front instead, add an http-socket rather than changing
; this one; UWSGI_HTTP_SOCKET in the environment does that without editing here.
socket = 0.0.0.0:8080
chmod-socket = 660
listen = 1024

buffer-size = 65535
harakiri = 300
max-requests = 100
worker-reload-mercy = 30
disable-logging = true

; Fixed pool, no cheaper ramp. uWSGI is at full capacity the moment it finishes
; forking. Upstream instead sized workers from RAM alone with no CPU term (40
; above 4GB) and let the busyness cheaper algorithm climb toward that ceiling,
; which is what made the API take minutes to become useful after a restart.
;
; Size this to the host: roughly one worker per core for CPU-bound load, more if
; the workload is I/O-bound, and budget 100-200MB of RAM per worker.
workers = 8
cheaper = 0
