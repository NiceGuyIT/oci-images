---
# Shared configuration for every Tactical RMM image. A single TRMM_VERSION
# bump rebuilds backend, frontend, meshcentral, nats and nginx.

tacticalrmm:
  url: https://github.com/amidaware/tacticalrmm/releases
  # The "v" prefix is added in build.nu when constructing the GitHub tarball URL.
  version: 1.5.1

published:
  # Packaging revision of these images, the way a distribution package carries
  # one: trmm1.5.1-2 is our second packaging of upstream 1.5.1. Increment it
  # whenever anything in this directory changes (a Dockerfile, an entrypoint, a
  # config template) and reset it to 1 when the upstream release above moves.
  #
  # Bumping this also changes the image identity marker the startup bootstrap
  # compares against, so a bump makes the next start run the full bootstrap.
  revision: 2

components:
  backend:
    # Published image name. The tag tracks the Tactical RMM upstream version.
    image_name: tactical-backend
    base_image: python
    base_tag: 3.11.8-slim
  frontend:
    image_name: tactical-frontend
    base_image: nginxinc/nginx-unprivileged
    base_tag: stable-alpine
  meshcentral:
    image_name: tactical-meshcentral
    base_image: node
    base_tag: 24-alpine
  nats:
    image_name: tactical-nats
    base_image: nats
    base_tag: 2.14.2-alpine
  nginx:
    image_name: tactical-nginx
    base_image: nginxinc/nginx-unprivileged
    base_tag: stable-alpine
