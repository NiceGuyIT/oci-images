---
# Tactical RMM stack.
#
# Brings up the five custom images (backend, frontend, meshcentral, nats, nginx)
# plus the stock postgres and redis dependencies. MeshCentral stores its data in
# the shared PostgreSQL server (tactical-postgres); tactical-init provisions the
# mesh database and role automatically. Copy `.env.example` to `.env`, fill in the
# secrets and host names, then `docker compose up -d`.
#
# IMAGE_REPO defaults to ghcr.io/niceguyit/ (the published location). Set it to
# an empty string if you have built the images locally with `./build.nu base`
# in each tactical-* directory and want to use those local tags directly.
#
# The Django tree is baked into the backend image at /opt/tactical and is NOT a
# volume. Mounting anything over /opt/tactical hides it, and the entrypoint
# aborts with a pointer to the migration instructions if it detects that. Only
# mutable state is mounted, in six small volumes; see the README migration
# section for moving an existing tactical-data volume onto this layout.

# Django settings applied from the environment by settings_env.py in the backend
# image. The name after TRMM_SETTING_ is the Django setting name. Values parse as
# JSON, so `"true"` is a bool and `"[30, 60]"` is a list; anything JSON rejects
# (such as `0.112.2`) stays a string. To force a numeric-looking value to stay a
# string, quote it as JSON: '"0.112"'. Every applied setting is printed to stderr
# at startup.
#
# Placement matters. This block belongs on the services that load Django settings
# at runtime. Settings read while tactical-init runs belong on tactical-init
# instead: migrations, superuser creation, and every UWSGI_* knob, since app.ini
# is generated there by create_uwsgi_conf. uwsgi runtime options (the listen
# socket in particular, which create_uwsgi_conf hardcodes) are not settable this
# way at all; use uWSGI's own UWSGI_<OPTION> env vars, as with UWSGI_HTTP_SOCKET
# on tactical-backend below.
x-trmm-settings: &trmm-settings
  TRMM_SETTING_INSTALL_NUSHELL_VERSION: "0.112.2"

# Shared by every service that loads Django settings. The conf volume is
# read-write rather than read-only because reload_nats() rewrites nats-rmm.conf
# from the running API whenever an agent is added or removed, not only during
# init.
x-django-volumes: &django-volumes
  - tactical-conf:/opt/tactical/conf
  - tactical-tmp:/opt/tactical/tmp
  - tactical-private:/opt/tactical/api/tacticalrmm/private
  - tactical-reporting:/opt/tactical/reporting
  - tactical-certs:/opt/tactical/certs:ro

networks:
  tactical-private:
    name: tactical-private
    driver: bridge

volumes:
  # Generated and operator-owned configuration: generated_settings.py,
  # local_settings.py, app.ini, nats-rmm.conf, nats-api.conf. Bind-mount a host
  # directory here to author them yourself.
  tactical-conf:
    name: tactical-conf
  # Cross-container handoffs: tactical.ready, mesh_token, web_tar_url.
  tactical-tmp:
    name: tactical-tmp
  # Generated agent installers and Django logs. Served by nginx under /private/.
  tactical-private:
    name: tactical-private
  # Self-signed or supplied TLS material, generated by tactical-nginx.
  tactical-certs:
    name: tactical-certs
  # Reporting assets uploaded through the dashboard.
  tactical-reporting:
    name: tactical-reporting
  # collectstatic output. Written by tactical-init, served by tactical-nginx.
  tactical-static:
    name: tactical-static
  tactical-meshcentral-data:
    name: tactical-meshcentral-data
  tactical-postgres:
    name: tactical-postgres
  tactical-redis:
    name: tactical-redis

services:
  tactical-postgres:
    image: postgres:13-alpine
    restart: always
    environment:
      POSTGRES_DB: tacticalrmm
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    volumes:
      - tactical-postgres:/var/lib/postgresql/data
    networks:
      - tactical-private

  tactical-redis:
    image: redis:6.0-alpine
    user: 1000:1000
    command: redis-server
    restart: always
    volumes:
      - tactical-redis:/data
    networks:
      - tactical-private

  # Runs as root so it can chown the state volumes on first use, which is what
  # makes a bind-mounted host directory work. It creates no large file trees:
  # the application code is baked into the image.
  tactical-init:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-backend:${VERSION}
    restart: on-failure
    command:
      - tactical-init
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASS}
      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
      CSRF_COOKIE_DOMAIN: ${CSRF_COOKIE_DOMAIN}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
      MESH_USER: ${MESH_USER}
      MESH_HOST: ${MESH_HOST}
      MESH_POSTGRES_HOST: ${MESH_POSTGRES_HOST:-tactical-postgres}
      MESH_POSTGRES_PORT: ${MESH_POSTGRES_PORT}
      MESH_POSTGRES_USER: ${MESH_POSTGRES_USER}
      MESH_POSTGRES_PASS: ${MESH_POSTGRES_PASS}
      MESH_POSTGRES_DATABASE: ${MESH_POSTGRES_DATABASE}
      TRMM_USER: ${TRMM_USER}
      TRMM_PASS: ${TRMM_PASS}
      TRMM_DISABLE_WEB_TERMINAL: ${TRMM_DISABLE_WEB_TERMINAL}
      TRMM_DISABLE_SERVER_SCRIPTS: ${TRMM_DISABLE_SERVER_SCRIPTS}
      TRMM_DISABLE_SSO: ${TRMM_DISABLE_SSO}
    # tactical-init provisions the MeshCentral role/database before mesh needs it,
    # so it must NOT depend on tactical-meshcentral (that ordering, plus mesh needing
    # the provisioned database, is the chicken-and-egg deadlock). init depends only
    # on the datastores; mesh waits for init's provisioning in its own entrypoint.
    depends_on:
      - tactical-postgres
      - tactical-redis
    volumes:
      - tactical-conf:/opt/tactical/conf
      - tactical-tmp:/opt/tactical/tmp
      - tactical-private:/opt/tactical/api/tacticalrmm/private
      - tactical-reporting:/opt/tactical/reporting
      - tactical-certs:/opt/tactical/certs
      - tactical-static:/opt/tactical/api/static
    networks:
      - tactical-private

  tactical-nats:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-nats:${VERSION}
    user: 1000:1000
    restart: always
    environment:
      API_HOST: ${API_HOST}
    # The upstream nats entrypoint reads ${TACTICAL_DIR}/api/nats-rmm.conf. This
    # image has no Django tree, so the conf volume is mounted at that path and
    # both generated configs appear exactly where the entrypoint expects them.
    volumes:
      - tactical-conf:/opt/tactical/api:ro
      - tactical-tmp:/opt/tactical/tmp
    depends_on:
      tactical-init:
        condition: service_completed_successfully
    networks:
      tactical-private:
        aliases:
          - ${API_HOST}

  tactical-meshcentral:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-meshcentral:${VERSION}
    user: 1000:1000
    restart: always
    environment:
      MESH_HOST: ${MESH_HOST}
      MESH_USER: ${MESH_USER}
      MESH_PASS: ${MESH_PASS}
      MESH_PERSISTENT_CONFIG: ${MESH_PERSISTENT_CONFIG}
      MESH_POSTGRES_HOST: ${MESH_POSTGRES_HOST:-tactical-postgres}
      MESH_POSTGRES_PORT: ${MESH_POSTGRES_PORT}
      MESH_POSTGRES_USER: ${MESH_POSTGRES_USER}
      MESH_POSTGRES_PASS: ${MESH_POSTGRES_PASS}
      MESH_POSTGRES_DATABASE: ${MESH_POSTGRES_DATABASE}
      NGINX_HOST_IP: tactical-nginx
    # Start after tactical-init so its database provisioning is already under way.
    # Completion is not required here (init later waits on mesh for the login token,
    # so a service_completed_successfully condition would re-introduce the deadlock);
    # the mesh entrypoint waits for the provisioned database itself.
    depends_on:
      - tactical-postgres
      - tactical-init
    volumes:
      - tactical-tmp:/opt/tactical/tmp
      - tactical-meshcentral-data:/home/node/app/meshcentral-data
    networks:
      tactical-private:
        aliases:
          - ${MESH_HOST}

  tactical-frontend:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-frontend:${VERSION}
    user: 1000:1000
    restart: always
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - tactical-tmp:/opt/tactical/tmp:ro
    depends_on:
      tactical-init:
        condition: service_completed_successfully
    networks:
      - tactical-private

  tactical-backend:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-backend:${VERSION}
    user: 1000:1000
    command:
      - tactical-backend
    restart: always
    environment:
      <<: *trmm-settings
      # Read by the uwsgi binary, not by settings_env.py, so it takes no
      # TRMM_SETTING_ prefix and needs no tactical-init re-run. UWSGI_* env vars
      # only fill in options app.ini does not set and are ignored for ones it
      # does, so this works solely because create_uwsgi_conf writes `socket` and
      # never `http-socket`. Worker and cheaper knobs are in app.ini, so they
      # must go through TRMM_SETTING_* on tactical-init. Uncomment when
      # fronting the stack with an HTTP reverse proxy (Caddy, Traefik) instead of
      # tactical-nginx, which uses uwsgi_pass against the hardcoded 8080 socket.
      # Both sockets bind: 8081 speaks HTTP, 8080 keeps the uwsgi protocol.
      #UWSGI_HTTP_SOCKET: 0.0.0.0:8081
    volumes: *django-volumes
    depends_on:
      tactical-postgres:
        condition: service_started
      tactical-init:
        condition: service_completed_successfully
    networks:
      - tactical-private

  tactical-websockets:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-backend:${VERSION}
    user: 1000:1000
    command:
      - tactical-websockets
    restart: always
    environment:
      <<: *trmm-settings
    volumes: *django-volumes
    depends_on:
      tactical-postgres:
        condition: service_started
      tactical-backend:
        condition: service_started
      tactical-init:
        condition: service_completed_successfully
    networks:
      - tactical-private

  tactical-celery:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-backend:${VERSION}
    user: 1000:1000
    command:
      - tactical-celery
    restart: always
    environment:
      <<: *trmm-settings
    volumes: *django-volumes
    depends_on:
      tactical-postgres:
        condition: service_started
      tactical-redis:
        condition: service_started
      tactical-init:
        condition: service_completed_successfully
    networks:
      - tactical-private

  tactical-celerybeat:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-backend:${VERSION}
    user: 1000:1000
    command:
      - tactical-celerybeat
    restart: always
    environment:
      <<: *trmm-settings
    volumes: *django-volumes
    depends_on:
      tactical-postgres:
        condition: service_started
      tactical-redis:
        condition: service_started
      tactical-init:
        condition: service_completed_successfully
    networks:
      - tactical-private

  # Serves /static/ and /private/ straight off the volumes the backend writes,
  # so it needs no application code. certs is read-write because this is the
  # service that generates the self-signed pair when none is supplied.
  tactical-nginx:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-nginx:${VERSION}
    user: 1000:1000
    restart: always
    environment:
      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
      MESH_HOST: ${MESH_HOST}
      CERT_PUB_KEY: ${CERT_PUB_KEY}
      CERT_PRIV_KEY: ${CERT_PRIV_KEY}
    ports:
      - "${TRMM_HTTP_PORT-80}:8080"
      - "${TRMM_HTTPS_PORT-443}:4443"
    volumes:
      - tactical-certs:/opt/tactical/certs
      - tactical-static:/opt/tactical/api/static:ro
      - tactical-private:/opt/tactical/api/tacticalrmm/private:ro
      - tactical-reporting:/opt/tactical/reporting:ro
    networks:
      - tactical-private
