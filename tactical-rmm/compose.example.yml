---
# Tactical RMM stack.
#
# Brings up the five custom images (backend, frontend, meshcentral, nats, nginx)
# plus the stock postgres and redis dependencies. MeshCentral stores its data in
# the shared PostgreSQL server (tactical-postgres), which the Django services
# provision automatically at startup. Copy `.env.example` to `.env`, fill in the
# secrets and host names, then `docker compose up -d`.
#
# IMAGE_REPO defaults to ghcr.io/niceguyit/ (the published location). Set it to
# an empty string if you have built the images locally with `./build.nu base`
# in each tactical-* directory and want to use those local tags directly.
#
# The Django tree is baked into the backend image at /opt/tactical and is NOT a
# volume. Mounting anything over /opt/tactical hides it, and the entrypoint
# aborts with a pointer to the migration instructions if it detects that. Only
# mutable state is mounted, in six small volumes; see the README migration
# section for moving an existing tactical-data volume onto this layout.

# Django settings applied from the environment by settings_env.py in the backend
# image. The name after TRMM_SETTING_ is the Django setting name. Values parse as
# JSON, so `"true"` is a bool and `"[30, 60]"` is a list; anything JSON rejects
# (such as `0.112.2`) stays a string. To force a numeric-looking value to stay a
# string, quote it as JSON: '"0.112"'. Every applied setting is printed to stderr
# at startup.
#
# Every Django service now runs the startup bootstrap, so there is no longer a
# separate place for settings read during it; this block reaches all of them.
# uwsgi is not configured this way at all: app.ini is a file you edit rather than
# something a management command regenerates. See tactical-conf/app.ini.
x-trmm-settings: &trmm-settings
  TRMM_SETTING_INSTALL_NUSHELL_VERSION: "0.112.2"

# Every Django service runs the same startup bootstrap, so every one of them
# needs the values it reads. This used to be the tactical-init service's
# environment; that service is gone and the work is serialized by an advisory
# lock instead, so the settings move here.
x-django-env: &django-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASS: ${POSTGRES_PASS}
  APP_HOST: ${APP_HOST}
  API_HOST: ${API_HOST}
  CSRF_COOKIE_DOMAIN: ${CSRF_COOKIE_DOMAIN}
  SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
  MESH_USER: ${MESH_USER}
  MESH_HOST: ${MESH_HOST}
  MESH_POSTGRES_HOST: ${MESH_POSTGRES_HOST:-tactical-postgres}
  MESH_POSTGRES_PORT: ${MESH_POSTGRES_PORT}
  MESH_POSTGRES_USER: ${MESH_POSTGRES_USER}
  MESH_POSTGRES_PASS: ${MESH_POSTGRES_PASS}
  MESH_POSTGRES_DATABASE: ${MESH_POSTGRES_DATABASE}
  TRMM_USER: ${TRMM_USER}
  TRMM_PASS: ${TRMM_PASS}
  TRMM_PERSISTENT_CONFIG: ${TRMM_PERSISTENT_CONFIG-1}
  TRMM_FORCE_INIT: ${TRMM_FORCE_INIT-0}
  TRMM_DISABLE_WEB_TERMINAL: ${TRMM_DISABLE_WEB_TERMINAL}
  TRMM_DISABLE_SERVER_SCRIPTS: ${TRMM_DISABLE_SERVER_SCRIPTS}
  TRMM_DISABLE_SSO: ${TRMM_DISABLE_SSO}

# Shared by every service that loads Django settings. The conf volume is
# read-write rather than read-only because reload_nats() rewrites nats-rmm.conf
# from the running API whenever an agent is added or removed, not only during
# the bootstrap. static is read-write because collectstatic runs in the bootstrap.
x-django-volumes: &django-volumes
  - tactical-conf:/opt/tactical/conf
  - tactical-tmp:/opt/tactical/tmp
  - tactical-private:/opt/tactical/api/tacticalrmm/private
  - tactical-reporting:/opt/tactical/reporting
  - tactical-static:/opt/tactical/api/static
  - tactical-certs:/opt/tactical/certs:ro

networks:
  tactical-private:
    name: tactical-private
    driver: bridge

volumes:
  # Configuration, in two classes. Rewritten every init: generated_settings.py,
  # nats-rmm.conf, nats-api.conf. Seeded once and then yours: local_settings.py
  # and app.ini. Bind-mount a host directory here to author the latter two
  # yourself; read-only is supported, the seed step skips what it cannot write.
  tactical-conf:
    name: tactical-conf
  # Cross-container handoffs: mesh_token, web_tar_url, and the tactical.ready
  # marker recording which image last completed a full bootstrap.
  tactical-tmp:
    name: tactical-tmp
  # Generated agent installers and Django logs. Served by nginx under /private/.
  tactical-private:
    name: tactical-private
  # Self-signed or supplied TLS material, generated by tactical-nginx.
  tactical-certs:
    name: tactical-certs
  # Reporting assets uploaded through the dashboard.
  tactical-reporting:
    name: tactical-reporting
  # collectstatic output. Written by the bootstrap, served by tactical-nginx.
  tactical-static:
    name: tactical-static
  tactical-meshcentral-data:
    name: tactical-meshcentral-data
  tactical-postgres:
    name: tactical-postgres
  tactical-redis:
    name: tactical-redis

services:
  tactical-postgres:
    image: postgres:13-alpine
    restart: always
    environment:
      POSTGRES_DB: tacticalrmm
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    volumes:
      - tactical-postgres:/var/lib/postgresql/data
    networks:
      - tactical-private

  tactical-redis:
    image: redis:6.0-alpine
    user: 1000:1000
    command: redis-server
    restart: always
    volumes:
      - tactical-redis:/data
    networks:
      - tactical-private

  tactical-nats:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-nats:${VERSION}
    user: 1000:1000
    restart: always
    environment:
      API_HOST: ${API_HOST}
    # The upstream nats entrypoint reads ${TACTICAL_DIR}/api/nats-rmm.conf. This
    # image has no Django tree, so the conf volume is mounted at that path and
    # both generated configs appear exactly where the entrypoint expects them.
    volumes:
      - tactical-conf:/opt/tactical/api:ro
      - tactical-tmp:/opt/tactical/tmp
    # No depends_on: the entrypoint waits for nats-rmm.conf, which whichever
    # Django container wins the bootstrap lock writes.
    networks:
      tactical-private:
        aliases:
          - ${API_HOST}

  tactical-meshcentral:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-meshcentral:${VERSION}
    user: 1000:1000
    restart: always
    environment:
      MESH_HOST: ${MESH_HOST}
      MESH_USER: ${MESH_USER}
      MESH_PASS: ${MESH_PASS}
      MESH_PERSISTENT_CONFIG: ${MESH_PERSISTENT_CONFIG-1}
      MESH_POSTGRES_HOST: ${MESH_POSTGRES_HOST:-tactical-postgres}
      MESH_POSTGRES_PORT: ${MESH_POSTGRES_PORT}
      MESH_POSTGRES_USER: ${MESH_POSTGRES_USER}
      MESH_POSTGRES_PASS: ${MESH_POSTGRES_PASS}
      MESH_POSTGRES_DATABASE: ${MESH_POSTGRES_DATABASE}
      NGINX_HOST_IP: tactical-nginx
    # The mesh entrypoint waits for its own database to be provisioned, which the
    # Django bootstrap does. Expressing that as a compose dependency would
    # deadlock, because the bootstrap in turn waits on mesh for the login token.
    depends_on:
      - tactical-postgres
    volumes:
      - tactical-tmp:/opt/tactical/tmp
      - tactical-meshcentral-data:/home/node/app/meshcentral-data
    networks:
      tactical-private:
        aliases:
          - ${MESH_HOST}

  tactical-frontend:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-frontend:${VERSION}
    user: 1000:1000
    restart: always
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - tactical-tmp:/opt/tactical/tmp:ro
    # No depends_on: the entrypoint waits for web_tar_url, which tactical-backend
    # writes during its bootstrap.
    networks:
      - tactical-private

  tactical-backend:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-backend:${VERSION}
    user: 1000:1000
    command:
      - tactical-backend
    restart: always
    environment:
      <<: [*django-env, *trmm-settings]
      # Read by the uwsgi binary, not by settings_env.py, so it takes no
      # TRMM_SETTING_ prefix. UWSGI_* env vars only fill in options app.ini does
      # not set and are ignored for ones it does, so this works because app.ini
      # declares `socket` and never `http-socket`; anything app.ini does set has
      # to be changed in the file itself. Uncomment when fronting the stack with
      # an HTTP reverse proxy (Caddy, Traefik) instead of tactical-nginx, which
      # uses uwsgi_pass against the 8080 socket. Both sockets bind: 8081 speaks
      # HTTP, 8080 keeps the uwsgi protocol.
      #UWSGI_HTTP_SOCKET: 0.0.0.0:8081
    volumes: *django-volumes
    depends_on:
      tactical-postgres:
        condition: service_started
    networks:
      - tactical-private

  tactical-websockets:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-backend:${VERSION}
    user: 1000:1000
    command:
      - tactical-websockets
    restart: always
    environment:
      <<: [*django-env, *trmm-settings]
    volumes: *django-volumes
    depends_on:
      tactical-postgres:
        condition: service_started
      tactical-backend:
        condition: service_started
    networks:
      - tactical-private

  tactical-celery:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-backend:${VERSION}
    user: 1000:1000
    command:
      - tactical-celery
    restart: always
    environment:
      <<: [*django-env, *trmm-settings]
    volumes: *django-volumes
    depends_on:
      tactical-postgres:
        condition: service_started
      tactical-redis:
        condition: service_started
    networks:
      - tactical-private

  tactical-celerybeat:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-backend:${VERSION}
    user: 1000:1000
    command:
      - tactical-celerybeat
    restart: always
    environment:
      <<: [*django-env, *trmm-settings]
    volumes: *django-volumes
    depends_on:
      tactical-postgres:
        condition: service_started
      tactical-redis:
        condition: service_started
    networks:
      - tactical-private

  # Serves /static/ and /private/ straight off the volumes the backend writes,
  # so it needs no application code. certs is read-write because this is the
  # service that generates the self-signed pair when none is supplied.
  tactical-nginx:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-nginx:${VERSION}
    user: 1000:1000
    restart: always
    environment:
      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
      MESH_HOST: ${MESH_HOST}
      CERT_PUB_KEY: ${CERT_PUB_KEY}
      CERT_PRIV_KEY: ${CERT_PRIV_KEY}
    ports:
      - "${TRMM_HTTP_PORT-80}:8080"
      - "${TRMM_HTTPS_PORT-443}:4443"
    volumes:
      - tactical-certs:/opt/tactical/certs
      - tactical-static:/opt/tactical/api/static:ro
      - tactical-private:/opt/tactical/api/tacticalrmm/private:ro
      - tactical-reporting:/opt/tactical/reporting:ro
    networks:
      - tactical-private
