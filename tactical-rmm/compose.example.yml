---
# Tactical RMM stack.
#
# Brings up the five custom images (backend, frontend, meshcentral, nats, nginx)
# plus the stock postgres and redis dependencies. MeshCentral stores its data in
# the shared PostgreSQL server (tactical-postgres); tactical-init provisions the
# mesh database and role automatically. Copy `.env.example` to `.env`, fill in the
# secrets and host names, then `docker compose up -d`.
#
# IMAGE_REPO defaults to ghcr.io/niceguyit/ (the published location). Set it to
# an empty string if you have built the images locally with `./build.nu base`
# in each tactical-* directory and want to use those local tags directly.

# Django settings applied from the environment by settings_env.py in the backend
# image. tactical-init rewrites local_settings.py on every run, so editing that
# file inside the volume does not survive a restart; set values here instead.
# The name after TRMM_SETTING_ is the Django setting name. Values parse as JSON,
# so `"true"` is a bool and `"[30, 60]"` is a list; anything JSON rejects (such as
# `0.112.2`) stays a string. To force a numeric-looking value to stay a string,
# quote it as JSON: '"0.112"'. Every applied setting is printed at startup.
x-trmm-settings: &trmm-settings
  TRMM_SETTING_INSTALL_NUSHELL_VERSION: "0.112.2"

networks:
  tactical-private:
    name: tactical-private
    driver: bridge

volumes:
  tactical-data:
    name: tactical-data
  tactical-meshcentral-data:
    name: tactical-meshcentral-data
  tactical-postgres:
    name: tactical-postgres
  tactical-redis:
    name: tactical-redis

services:
  tactical-postgres:
    image: postgres:13-alpine
    restart: always
    environment:
      POSTGRES_DB: tacticalrmm
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    volumes:
      - tactical-postgres:/var/lib/postgresql/data
    networks:
      - tactical-private

  tactical-redis:
    image: redis:6.0-alpine
    user: 1000:1000
    command: redis-server
    restart: always
    volumes:
      - tactical-redis:/data
    networks:
      - tactical-private

  tactical-init:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-backend:${VERSION}
    restart: on-failure
    command:
      - tactical-init
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASS}
      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
      CSRF_COOKIE_DOMAIN: ${CSRF_COOKIE_DOMAIN}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
      MESH_USER: ${MESH_USER}
      MESH_HOST: ${MESH_HOST}
      MESH_POSTGRES_HOST: ${MESH_POSTGRES_HOST:-tactical-postgres}
      MESH_POSTGRES_PORT: ${MESH_POSTGRES_PORT}
      MESH_POSTGRES_USER: ${MESH_POSTGRES_USER}
      MESH_POSTGRES_PASS: ${MESH_POSTGRES_PASS}
      MESH_POSTGRES_DATABASE: ${MESH_POSTGRES_DATABASE}
      TRMM_USER: ${TRMM_USER}
      TRMM_PASS: ${TRMM_PASS}
      TRMM_DISABLE_WEB_TERMINAL: ${TRMM_DISABLE_WEB_TERMINAL}
      TRMM_DISABLE_SERVER_SCRIPTS: ${TRMM_DISABLE_SERVER_SCRIPTS}
      TRMM_DISABLE_SSO: ${TRMM_DISABLE_SSO}
    # tactical-init provisions the MeshCentral role/database before mesh needs it,
    # so it must NOT depend on tactical-meshcentral (that ordering, plus mesh needing
    # the provisioned database, is the chicken-and-egg deadlock). init depends only
    # on the datastores; mesh waits for init's provisioning in its own entrypoint.
    depends_on:
      - tactical-postgres
      - tactical-redis
    volumes:
      - tactical-data:/opt/tactical
      - tactical-meshcentral-data:/meshcentral-data
      - tactical-redis:/redis/data
    networks:
      - tactical-private

  tactical-nats:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-nats:${VERSION}
    user: 1000:1000
    restart: always
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - tactical-data:/opt/tactical
    networks:
      tactical-private:
        aliases:
          - ${API_HOST}

  tactical-meshcentral:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-meshcentral:${VERSION}
    user: 1000:1000
    restart: always
    environment:
      MESH_HOST: ${MESH_HOST}
      MESH_USER: ${MESH_USER}
      MESH_PASS: ${MESH_PASS}
      MESH_PERSISTENT_CONFIG: ${MESH_PERSISTENT_CONFIG}
      MESH_POSTGRES_HOST: ${MESH_POSTGRES_HOST:-tactical-postgres}
      MESH_POSTGRES_PORT: ${MESH_POSTGRES_PORT}
      MESH_POSTGRES_USER: ${MESH_POSTGRES_USER}
      MESH_POSTGRES_PASS: ${MESH_POSTGRES_PASS}
      MESH_POSTGRES_DATABASE: ${MESH_POSTGRES_DATABASE}
      NGINX_HOST_IP: tactical-nginx
    # Start after tactical-init so its database provisioning is already under way.
    # Completion is not required here (init later waits on mesh for the login token,
    # so a service_completed_successfully condition would re-introduce the deadlock);
    # the mesh entrypoint waits for the provisioned database itself.
    depends_on:
      - tactical-postgres
      - tactical-init
    volumes:
      - tactical-data:/opt/tactical
      - tactical-meshcentral-data:/home/node/app/meshcentral-data
    networks:
      tactical-private:
        aliases:
          - ${MESH_HOST}

  tactical-frontend:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-frontend:${VERSION}
    user: 1000:1000
    restart: always
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - tactical-data:/opt/tactical
    networks:
      - tactical-private

  tactical-backend:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-backend:${VERSION}
    user: 1000:1000
    command:
      - tactical-backend
    restart: always
    environment:
      <<: *trmm-settings
    volumes:
      - tactical-data:/opt/tactical
    depends_on:
      - tactical-postgres
    networks:
      - tactical-private

  tactical-websockets:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-backend:${VERSION}
    user: 1000:1000
    command:
      - tactical-websockets
    restart: always
    environment:
      <<: *trmm-settings
    volumes:
      - tactical-data:/opt/tactical
    depends_on:
      - tactical-postgres
      - tactical-backend
    networks:
      - tactical-private

  tactical-celery:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-backend:${VERSION}
    user: 1000:1000
    command:
      - tactical-celery
    restart: always
    environment:
      <<: *trmm-settings
    volumes:
      - tactical-data:/opt/tactical
    depends_on:
      - tactical-postgres
      - tactical-redis
    networks:
      - tactical-private

  tactical-celerybeat:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-backend:${VERSION}
    user: 1000:1000
    command:
      - tactical-celerybeat
    restart: always
    environment:
      <<: *trmm-settings
    volumes:
      - tactical-data:/opt/tactical
    depends_on:
      - tactical-postgres
      - tactical-redis
    networks:
      - tactical-private

  tactical-nginx:
    image: ${IMAGE_REPO-ghcr.io/niceguyit/}tactical-nginx:${VERSION}
    user: 1000:1000
    restart: always
    environment:
      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
      MESH_HOST: ${MESH_HOST}
      CERT_PUB_KEY: ${CERT_PUB_KEY}
      CERT_PRIV_KEY: ${CERT_PRIV_KEY}
    ports:
      - "${TRMM_HTTP_PORT-80}:8080"
      - "${TRMM_HTTPS_PORT-443}:4443"
    volumes:
      - tactical-data:/opt/tactical
    networks:
      - tactical-private
